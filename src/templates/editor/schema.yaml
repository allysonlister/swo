id: http://purl.obolibrary.org/obo/swo.owl
name: SoftwareOntology
title: Software Ontology
description: >-
  The Software Ontology (SWO) is a resource for describing software tools, their types, tasks, versions, provenance and associated data. It contains detailed information on licensing and formats as well as software applications themselves, mainly (but not limited) to the bioinformatics community.
version: 1.0.0
annotations:
  list_delimiter: "|"
  application: robot

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  obo: http://purl.obolibrary.org/obo/
  SWO: http://purl.obolibrary.org/obo/SWO_
  SWOO: http://purl.obolibrary.org/obo/SWOO_
  IAO: http://purl.obolibrary.org/obo/IAO_
  RO: http://purl.obolibrary.org/obo/RO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  EDAM: http://edamontology.org/
  ODME: http://kt.ijs.si/panovp/OntoDM#
  ROLEGACY: http://www.obofoundry.org/ro/ro.owl#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  dcterms: http://purl.org/dc/terms/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: SWO
default_range: string

classes:

  Software:
    name: Software
    title: Software
    description: >-
      A software entry in the ontology.
    slots:
      - ontology_id
      - label
      - parent
      - definition
      - definition_source
      - comment
      - term_creator
      - has_specified_data_input
      - has_specified_data_output
      - is_encoded_in
      - is_executed_in
      - has_license
      - has_website_homepage
      - is_published_by
      - implements
      - output_of
      - has_interface
      - is_developed_by
      - uses_platform
      - has_support_url
      - uses_software
      - has_documentation
      - has_part
      - has_version
      - is_software_for
      - has_declared_status
      - has_release_date
      - has_download_location
      - directly_followed_by
      - directly_preceded_by
    slot_usage:
      ontology_id:
        rank: 1
        slot_group: Ontology Metadata
      label:
        rank: 2
        slot_group: Ontology Metadata
      parent:
        rank: 3
        slot_group: Ontology Metadata
      definition:
        rank: 4
        slot_group: Ontology Metadata
      definition_source:
        rank: 5
        slot_group: Ontology Metadata
      comment:
        rank: 6
        slot_group: Ontology Metadata
      term_creator:
        rank: 7
        slot_group: Ontology Metadata
      has_specified_data_input:
        rank: 8
        slot_group: Properties
      has_specified_data_output:
        rank: 9
        slot_group: Properties
      is_encoded_in:
        rank: 10
        slot_group: Properties
      is_executed_in:
        rank: 11
        slot_group: Properties
      has_license:
        rank: 12
        slot_group: Properties
      has_website_homepage:
        rank: 13
        slot_group: Properties
      is_published_by:
        rank: 14
        slot_group: Properties
      implements:
        rank: 15
        slot_group: Properties
      output_of:
        rank: 16
        slot_group: Properties
      has_interface:
        rank: 17
        slot_group: Properties
      is_developed_by:
        rank: 18
        slot_group: Properties
      uses_platform:
        rank: 19
        slot_group: Properties
      has_support_url:
        rank: 20
        slot_group: Properties
      uses_software:
