        slot_group: Properties

slots:

  ontology_id:
    name: ontology_id
    title: Ontology ID
    annotations:
      robot: "ID"
    description: >-
      CURIE identifier for this class (e.g. SWO:0000005). For new entries
      use the next available numeric ID.
    slot_uri: dcterms:identifier
    identifier: true
    unique: true
    required: true
    range: uriorcurie

  label:
    name: label
    title: label
    annotations:
      robot: "A rdfs:label"
      # TODO: promote to "AL rdfs:label@en" once swo-edit.owl plain-literal
      # annotations are upgraded to language-tagged (@en) literals throughout.
    description: >-
      Primary English name (rdfs:label) of this class.
    slot_uri: rdfs:label
    required: true
    range: WhitespaceMinimizedString

  parent:
    name: parent
    title: parent
    annotations:
      robot: SC %
    description: >-
      Direct OWL superclass of this entry.
    range: SoftwareMenu

  definition:
    name: definition
    title: definition
    annotations:
      robot: "A IAO:0000115"
      # TODO: promote to "AL IAO:0000115@en" once swo-edit.owl plain-literal
      # annotations are upgraded to language-tagged (@en) literals throughout.
    description: >-
      Textual definition (IAO:0000115) for this class.
    slot_uri: IAO:0000115
    range: string

  definition_source:
    name: definition_source
    title: definition source
    annotations:
      robot: "A IAO:0000119 SPLIT=|"
    description: >-
      Source URI(s) for the definition (IAO:0000119). Separate multiple
      values with |.
    slot_uri: IAO:0000119
    multivalued: true
    range: WhitespaceMinimizedString

  comment:
    name: comment
    title: comment
    annotations:
      robot: "A rdfs:comment"
      # TODO: promote to "AL rdfs:comment@en" once swo-edit.owl plain-literal
      # annotations are upgraded to language-tagged (@en) literals throughout.
    description: >-
      Free-text rdfs:comment annotation.
    slot_uri: rdfs:comment
    range: string

  term_creator:
    name: term_creator
    title: term creator
    annotations:
      robot: "A dcterms:creator SPLIT=|"
    description: >-
      Name(s) of the curator(s) who added this entry (dcterms:creator).
      Separate multiple values with |.
    slot_uri: dcterms:creator
    multivalued: true
    range: WhitespaceMinimizedString

  has_specified_data_input:
    name: has_specified_data_input
    title: has specified data input
    annotations:
      robot: "SC 'has specified data input' some % SPLIT=|"
    description: >-
      has specified data input.
    slot_uri: SWO:0000086
    multivalued: true
    range: HasSpecifiedDataInputMenu_DataEntity

  has_specified_data_output:
