# software_schema_spec.yaml
# Input specification for onto_to_linkml_schema.py.
# Describes the LinkML schema to generate for the SWO Software class.
#
# Usage:
#   python onto_to_linkml_schema.py \
#       --spec   src/templates/swo/software_schema_spec.yaml \
#       --output src/templates/swo/schema.yaml

# Path to the OWL ontology (relative to this file, or override with --ontology)
ontology: ../../ontology/swo-edit.owl

schema:
  id: https://github.com/allysonlister/swo/schema/Software
  name: SWO_Software
  title: "Software Ontology (SWO) — Software Template"
  description: >-
    DataHarmonizer template for curating SWO software entries.
    Each row represents one subclass of SWO:0000001 (software).
    Enumeration columns store CURIEs; titles carry human-readable labels.
  version: 1.0.0

prefixes:
  linkml:  https://w3id.org/linkml/
  SWOA:    http://www.ebi.ac.uk/swo/
  SWO:     http://www.ebi.ac.uk/swo/SWO_
  SWOL:    http://www.ebi.ac.uk/swo/license/SWO_
  SWOI:    http://www.ebi.ac.uk/swo/interface/SWO_
  SWOD:    http://www.ebi.ac.uk/swo/data/SWO_
  SWOB:    http://www.ebi.ac.uk/swo/objective/SWO_
  SWOO:    http://www.ebi.ac.uk/swo/organization/SWO_
  IAO:     http://purl.obolibrary.org/obo/IAO_
  RO:      http://purl.obolibrary.org/obo/RO_
  OBI:     http://purl.obolibrary.org/obo/OBI_
  EDAM:    http://edamontology.org/
  ODME:    http://kt.ijs.si/panovp/OntoDM#
  rdfs:    http://www.w3.org/2000/01/rdf-schema#
  dcterms: http://purl.org/dc/terms/
  xsd:     http://www.w3.org/2001/XMLSchema#

default_prefix: SWOA

# ---------------------------------------------------------------------------
# Classes
# Each class entry collects all transitive subclasses of root_iri as the
# rowset that this template describes.
# ---------------------------------------------------------------------------
classes:
  - name: Software
    description: A software application or tool indexed in the Software Ontology.
    root_iri: http://www.ebi.ac.uk/swo/SWO_0000001

# ---------------------------------------------------------------------------
# Slots
# Order determines column order in the generated schema.
# Each slot carries a 'robot' annotation — the ROBOT template row-2 code
# for that column (see ROBOT template docs).
# ---------------------------------------------------------------------------
slots:
  - name: Ontology ID
    slot_uri: dcterms:identifier
    range: WhitespaceMinimizedString
    identifier: true
    unique: true
    required: true
    slot_group: Ontology Metadata
    robot: ID
    description: >-
      CURIE identifier for this software class (e.g. SWO:0000005).
      For new entries use the next available SWO numeric ID.
    examples:
      - SWO:0000005

  - name: label
    slot_uri: rdfs:label
    range: WhitespaceMinimizedString
    required: true
    slot_group: Ontology Metadata
    robot: AL rdfs:label@en
    description: Primary English name (rdfs:label) of this software.
    examples:
      - MATLAB

  - name: parent
    range: SoftwareMenu
    slot_group: Ontology Metadata
    robot: SC %
    description: >-
      Direct OWL superclass. SWO:0000001 (software) for top-level
      entries; a more specific software subclass for nested entries.
    examples:
      - SWO:0000001

  - name: definition
    slot_uri: "IAO:0000115"
    range: string
    slot_group: Ontology Metadata
    robot: AL IAO:0000115@en
    description: Textual definition (IAO:0000115) for this software.

  - name: definition source
    slot_uri: "IAO:0000119"
    range: WhitespaceMinimizedString
    multivalued: true
    slot_group: Ontology Metadata
    robot: "A IAO:0000119 SPLIT=|"
    description: >-
      Source URI(s) for the definition (IAO:0000119).
      Separate multiple values with |.
    examples:
      - http://www.mathworks.com/products/matlab/

  - name: comment
    slot_uri: rdfs:comment
    range: string
    slot_group: Ontology Metadata
    robot: AL rdfs:comment@en
    description: Free-text rdfs:comment annotation.

  - name: term creator
    slot_uri: dcterms:creator
    range: WhitespaceMinimizedString
    multivalued: true
    slot_group: Ontology Metadata
    robot: "A dcterms:creator SPLIT=|"
    description: >-
      Name(s) of the curator(s) who added this entry (dcterms:creator).
      Separate multiple values with |.
    examples:
      - Allyson Lister

  - name: website homepage
    slot_uri: "SWOA:SWO_0004006"
    range: WhitespaceMinimizedString
    slot_group: Software Properties
    robot: SC SWO_0004006 value %
    description: Official website URL (SWO:SWO_0004006 hasValue).
    examples:
      - http://www.mathworks.com/

  - name: license
    slot_uri: "SWOA:has_license"
    range: LicenseMenu
    multivalued: true
    slot_group: Software Properties
    robot: "SC has_license some % SPLIT=|"
    description: >-
      License(s) under which this software is distributed.
      Separate multiple values with |.
    examples:
      - GNU General Public License version 2.0

  - name: software interface
    slot_uri: "SWOA:SWO_0004001"
    range: SoftwareInterfaceMenu
    multivalued: true
    slot_group: Software Properties
    robot: "SC SWO_0004001 some % SPLIT=|"
    description: >-
      User/programmatic interface type(s) (SWO:SWO_0004001).
      Separate multiple values with |.
    examples:
      - command-line interface

  - name: is executed in
    slot_uri: "SWOA:SWO_0040005"
    range: ExecutionEnvironmentMenu
    multivalued: true
    slot_group: Software Properties
    robot: "SC SWO_0040005 some % SPLIT=|"
    description: >-
      Software operation(s) or environment(s) this software executes in
      (SWO:SWO_0040005). Separate multiple values with |.
    examples:
      - differential expression analysis

  - name: developer organization
    slot_uri: "RO:0002353"
    range: OrganizationMenu
    multivalued: true
    slot_group: Organizations
    robot: "SC RO_0002353 some (SWOO:9000056 and RO_0000057 value %) SPLIT=|"
    description: >-
      Organization(s) that developed this software.
      Separate multiple values with |.
    examples:
      - The MathWorks Inc.

  - name: publisher organization
    slot_uri: "RO:0002353"
    range: OrganizationMenu
    multivalued: true
    slot_group: Organizations
    robot: "SC RO_0002353 some (SWOO:9000055 and RO_0000057 value %) SPLIT=|"
    description: >-
      Organization(s) that publish/distribute this software.
      Separate multiple values with |.

  - name: "has specified data input format (IAO data item)"
    slot_uri: "SWOA:SWO_0000086"
    range: DataFormatMenu
    multivalued: true
    slot_group: Data Formats
    robot: "SC SWO_0000086 some (IAO:0000027 and SWO_0004002 some %) SPLIT=|"
    description: >-
      File/data format(s) accepted as input (SWO:SWO_0000086).
      Separate multiple values with |.
    examples:
      - .csv

  - name: "has specified data output format (IAO data item)"
    slot_uri: "SWOA:SWO_0000087"
    range: DataFormatMenu
    multivalued: true
    slot_group: Data Formats
    robot: "SC SWO_0000087 some (IAO:0000027 and SWO_0004002 some %) SPLIT=|"
    description: >-
      File/data format(s) produced as output (SWO:SWO_0000087).
      Separate multiple values with |.

# ---------------------------------------------------------------------------
# Enums
# Each enum has a 'query' that describes how to collect permissible values
# from the OWL ontology.
#
# Supported query types:
#   subclasses_of          — all transitive subclasses of root_iri
#                            include_root: true (default) adds the root itself
#   range_of_property      — rdfs:range traversal of property_iri,
#                            supplemented by classes in ns_fallbacks namespaces
#   individuals_in_namespace — owl:NamedIndividual subjects in namespace
# ---------------------------------------------------------------------------
enums:
  SoftwareMenu:
    description: All subclasses of SWO:0000001 (software), including the root.
    query:
      type: subclasses_of
      root_iri: http://www.ebi.ac.uk/swo/SWO_0000001
      include_root: true

  LicenseMenu:
    description: License classes (has_license range + SWOL namespace).
    query:
      type: range_of_property
      property_iri: http://www.ebi.ac.uk/swo/has_license
      ns_fallbacks:
        - http://www.ebi.ac.uk/swo/license/SWO_

  SoftwareInterfaceMenu:
    description: Software interface types (has_interface range + SWOI namespace).
    query:
      type: range_of_property
      property_iri: http://www.ebi.ac.uk/swo/SWO_0004001
      ns_fallbacks:
        - http://www.ebi.ac.uk/swo/interface/SWO_

  ExecutionEnvironmentMenu:
    description: Execution environments and objectives (is_executed_in range + SWOB namespace).
    query:
      type: range_of_property
      property_iri: http://www.ebi.ac.uk/swo/SWO_0040005
      ns_fallbacks:
        - http://www.ebi.ac.uk/swo/objective/SWO_

  OrganizationMenu:
    description: Developer/publisher organizations (NamedIndividuals in SWOO namespace).
    query:
      type: individuals_in_namespace
      namespace: http://www.ebi.ac.uk/swo/organization/SWO_

  DataFormatMenu:
    description: Data formats (has_format_specification range + SWOD and EDAM namespaces).
    query:
      type: range_of_property
      property_iri: http://www.ebi.ac.uk/swo/SWO_0004002
      ns_fallbacks:
        - http://www.ebi.ac.uk/swo/data/SWO_
        - http://edamontology.org/format_
